replicaCount: 2
image: {repository: registry.example/fpm/payments, tag: latest, pullPolicy: IfNotPresent}
otelEndpoint: http://jaeger:4317
migration: {enabled: true}
resources:
  requests: {cpu: 150m, memory: 192Mi}
  limits: {cpu: 1000m, memory: 768Mi}
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 12
  targetCPUUtilizationPercentage: 65
  targetMemoryUtilizationPercentage: 75
