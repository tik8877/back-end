replicaCount: 2
image: {repository: registry.example/fpm/cashback, tag: latest, pullPolicy: IfNotPresent}
otelEndpoint: http://jaeger:4317
migration: {enabled: true}
resources:
  requests: {cpu: 100m, memory: 192Mi}
  limits: {cpu: 750m, memory: 768Mi}
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 12
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 75
