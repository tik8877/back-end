stages:
  - build
  - test
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  POETRY_CACHE_DIR: "$CI_PROJECT_DIR/.cache/poetry"
  DOCKER_TLS_CERTDIR: "/certs"
  DEPLOY_NAMESPACE: "fpm-processing"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/pip/
    - .cache/poetry/

.build_template:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - SERVICE_PATH="services/$SERVICE"
    - if [ "$SERVICE" = "gateway" ]; then SERVICE_PATH="gateway"; fi
    - docker build --build-arg SERVICE_PATH="$SERVICE_PATH" -t "$CI_REGISTRY_IMAGE/$SERVICE:$CI_COMMIT_SHA" -f "$SERVICE_PATH/Dockerfile" .
    - docker push "$CI_REGISTRY_IMAGE/$SERVICE:$CI_COMMIT_SHA"
  parallel:
    matrix:
      - SERVICE: [gateway, auth, accounts, payments, ledger, antifraud, notification, cashback, external]

.test_template:
  stage: test
  image: python:3.12-slim
  services:
    - name: postgres:16-alpine
      alias: postgres
    - name: redis:7-alpine
      alias: redis
  variables:
    POSTGRES_DB: fpm_test
    POSTGRES_USER: fpm
    POSTGRES_PASSWORD: "$TEST_POSTGRES_PASSWORD"
    DATABASE_URL: "postgresql+asyncpg://fpm:${TEST_POSTGRES_PASSWORD}@postgres:5432/fpm_test"
    TEST_DATABASE_URL: "postgresql+asyncpg://fpm:${TEST_POSTGRES_PASSWORD}@postgres:5432/fpm_test"
    REDIS_URL: redis://redis:6379/0
  before_script:
    - pip install poetry
    - poetry config virtualenvs.create false
    - poetry install --no-interaction
  script:
    - TEST_PATH="services/$SERVICE/tests"
    - if [ "$SERVICE" = "gateway" ]; then TEST_PATH="gateway/tests"; fi
    - pytest "$TEST_PATH" --cov="${TEST_PATH%/tests}/app" --cov-report=term --cov-report=xml --cov-report=html --cov-fail-under=80
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - coverage.xml
      - htmlcov/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
  parallel:
    matrix:
      - SERVICE: [gateway, auth, accounts, payments, ledger, antifraud, notification, cashback, external]

.deploy_template:
  stage: deploy
  image: alpine/helm:3.16.2
  script:
    - helm dependency build "infra/helm/$SERVICE"
    - helm upgrade --install "$SERVICE" "infra/helm/$SERVICE" --namespace "$DEPLOY_NAMESPACE" --create-namespace --set "image.repository=$CI_REGISTRY_IMAGE/$SERVICE" --set "image.tag=$CI_COMMIT_SHA" --atomic --wait --timeout 5m
  environment:
    name: "$CI_COMMIT_REF_SLUG/$SERVICE"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH'
      when: manual
  parallel:
    matrix:
      - SERVICE: [gateway, auth, accounts, payments, ledger, antifraud, notification, cashback, external]

build:
  extends: .build_template

test:
  extends: .test_template

deploy:
  extends: .deploy_template
